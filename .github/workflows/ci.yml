name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and Docker deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --locked --no-sync pytest -q

      - name: Build production image
        run: docker build --tag api-performance-monitor:ci .

      - name: Verify migrations and API with isolated PostgreSQL
        run: uv run --locked --no-sync python scripts/check_docker_deploy.py
